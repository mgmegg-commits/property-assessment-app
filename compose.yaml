# Cecil's Report Builder: one copy of the app.
#   db     PostgreSQL: records, documents, the audit trail
#   app    the server and web app (built from this folder's Dockerfile)
#   caddy  HTTPS in front of the app
#
# Settings come from .env (./start.sh creates it from .env.example).
# On a Mac, run ./start.sh rather than docker compose directly: it also works
# out this computer's network address for iPads and iPhones.

name: cecils-report-builder

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./start.sh first; it creates .env with a database password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports -d reports"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    image: cecils-report-builder:local
    environment:
      DATABASE_URL: postgres://reports:${POSTGRES_PASSWORD}@db:5432/reports
      APP_ENV: ${APP_ENV:-production}
      LOAD_FIXTURES: ${LOAD_FIXTURES:-0}
      FIXTURES_DIR: /fixtures
    volumes:
      # Test data, read-only. Only loaded when APP_ENV=development and LOAD_FIXTURES=1.
      - ./tests/fixtures/seed:/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:-https://localhost:8443}
      PRIMARY_URL: ${PRIMARY_URL:-https://localhost:8443}
      DEFAULT_SNI: ${DEFAULT_SNI:-localhost}
    ports:
      # The app over plain HTTP, for this computer only.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      # The app over HTTPS, for iPads and iPhones on the same network.
      - "${HTTPS_PORT:-8443}:8443"
      # The certificate set-up page for iPads and iPhones.
      - "${SETUP_PORT:-8081}:8081"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
