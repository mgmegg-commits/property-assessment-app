<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F4B6E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cecil's Report Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a field-report workbench. Sticky header + tab strip; photo board = item rail + photo tray; findings = stacked section sheets. */
:root{
  --paper:#F3F5F6; --surface:#FFFFFF; --sunk:#E9EDF0; --ink:#17212B; --muted:#586674; --line:#D6DDE3;
  --accent:#1F4B6E; --accent-ink:#FFFFFF; --accent-soft:#E1EAF2;
  --good:#2D7A4C; --fair:#A1650C; --poor:#B2392D; --na:#7A8794;
  --good-soft:#E2F1E8; --fair-soft:#F7ECD9; --poor-soft:#F7E1DE;
  --sel:#2F7DD1;
  --todo:#FFF4CC; --todo-line:#E6C35A; --todo-ink:#7A5A00;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141A; --surface:#161F27; --sunk:#1C2731; --ink:#E4EBF0; --muted:#97A5B2; --line:#2A3846;
  --accent:#86B6DE; --accent-ink:#0C1824; --accent-soft:#1B3245;
  --good:#5DC08A; --fair:#E3A64A; --poor:#F17C6E; --na:#8E9BA7;
  --good-soft:#173326; --fair-soft:#3A2B12; --poor-soft:#3D1D19; --sel:#6AAEF5;
  --todo:#3A3112; --todo-line:#7A6420; --todo-ink:#F0CF6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141A; --surface:#161F27; --sunk:#1C2731; --ink:#E4EBF0; --muted:#97A5B2; --line:#2A3846;
  --accent:#86B6DE; --accent-ink:#0C1824; --accent-soft:#1B3245;
  --good:#5DC08A; --fair:#E3A64A; --poor:#F17C6E; --na:#8E9BA7;
  --good-soft:#173326; --fair-soft:#3A2B12; --poor-soft:#3D1D19; --sel:#6AAEF5;
  --todo:#3A3112; --todo-line:#7A6420; --todo-ink:#F0CF6A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:1.6rem;font-weight:750}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stack{display:grid;gap:14px}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--poor)}
.btn.danger.armed{background:var(--poor);color:#fff;border-color:var(--poor)}
.btn.sm{padding:4px 9px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

/* Forms */
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.rowgrid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
@media (max-width:640px){.rowgrid{grid-template-columns:1fr;padding-bottom:10px;border-bottom:1px solid var(--line)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
fieldset.lock{border:0;margin:0;padding:0;min-width:0}
fieldset.lock:disabled textarea,fieldset.lock:disabled input,fieldset.lock:disabled select{background:var(--sunk)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:80%;font-weight:750;font-size:1.08rem;letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.brand .mark{width:26px;height:26px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.crumb{min-width:0;display:grid}
.crumb b{font-family:var(--f-display);font-stretch:85%;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savestate{font-size:.8rem;color:var(--muted);white-space:nowrap}
.savestate.err{color:var(--poor);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 14px;border-bottom:2.5px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;font-size:.92rem}
nav.tabs a.on{color:var(--ink);border-color:var(--accent)}
nav.tabs a .ct{font-family:var(--f-mono);font-weight:400;font-size:.78rem;margin-left:5px;padding:1px 6px;border-radius:9px;background:var(--sunk)}
nav.tabs a .ct.warn{background:var(--fair-soft);color:var(--fair)}

.banner{margin-block:0 14px;padding:9px 12px;border-radius:var(--r);background:var(--fair-soft);color:var(--ink);font-size:.88rem;border:1px solid color-mix(in srgb,var(--fair) 35%,transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
main{padding-block:18px 120px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.pill.issued{background:var(--good-soft);color:var(--good)}
.pill.draft{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:var(--fair-soft);color:var(--fair)}
.rate{display:inline-flex;align-items:center;justify-content:center;min-width:44px;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.rate.G{background:var(--good-soft);color:var(--good)}
.rate.F{background:var(--fair-soft);color:var(--fair)}
.rate.P{background:var(--poor-soft);color:var(--poor)}
.rate.NA,.rate.none{background:var(--sunk);color:var(--na)}
.prio{font-family:var(--f-mono);font-weight:500;font-size:.78rem;padding:1px 6px;border-radius:4px}
.prio.H{background:var(--poor-soft);color:var(--poor)}
.prio.M{background:var(--fair-soft);color:var(--fair)}
.prio.L{background:var(--accent-soft);color:var(--accent)}

/* Home */
.home-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;cursor:pointer;text-align:left}
.acard:hover{border-color:var(--accent)}
.acard .t{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.15rem;line-height:1.2}
.acard .facts{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.acard .facts b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h2{color:var(--ink)}

/* Photo board */
.board{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--header-h,104px) + 12px);max-height:calc(100vh - var(--header-h,104px) - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.rail-views{display:grid;gap:2px}
.rail-h{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 8px 6px;margin-top:8px;border-top:1px solid var(--line)}
.rail-sections{display:grid;gap:2px}
.drop{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:7px 9px;border-radius:6px;cursor:pointer;font:inherit;font-size:.88rem;color:var(--ink);background:none;border:1.5px solid transparent}
.drop:hover{background:var(--sunk)}
.drop.over{border-color:var(--sel);background:var(--accent-soft)}
.drop .n{margin-left:auto;font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.drop svg{width:16px;height:16px;flex:none;color:var(--muted)}
.drop.view.on{background:var(--ink);color:var(--paper);font-weight:600}
.drop.view.on svg,.drop.view.on .n{color:var(--paper)}
.drop.view.minor{padding-left:34px;font-size:.82rem;color:var(--muted)}
.drop.secrow .no{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);width:16px;flex:none}
.drop.secrow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.view-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.view-h h2{font-size:1.15rem}
.view-h.section{padding:12px 14px;border-radius:10px;background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.view-h.section .no{font-family:var(--f-mono);color:var(--muted)}
.secview{display:grid;gap:12px}
.subsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;border:1.5px solid var(--line)}
.subsec.over,.fgroup.over{border-color:var(--sel);background:var(--accent-soft)}
.subsec-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.subsec-h .no{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.subsec-h h3{font-size:1rem}
.subsec-empty{font-size:.84rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center}
.fgroup{display:grid;gap:8px;padding:8px 10px;border-left:3px solid var(--line);border-radius:0 8px 8px 0;border-top:1.5px solid transparent;border-right:1.5px solid transparent;border-bottom:1.5px solid transparent}
.fgroup-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.88rem}
.fgroup-h .mono{font-size:.76rem;color:var(--muted)}
.uploader{border:1.5px dashed var(--line);border-radius:10px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.uploader.over{border-color:var(--sel);background:var(--accent-soft)}
.uploader .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.uploader .ic svg{width:22px;height:22px}
.progress{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden;flex:1 1 200px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:.84rem;cursor:pointer}
a.chip{text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.group-h{display:flex;gap:10px;align-items:baseline;margin:16px 0 8px;font-size:.84rem;color:var(--muted)}
.group-h b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.group-h button{font-size:.8rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.ph .pimg{aspect-ratio:4/3;max-width:100%}
.ph .meta{padding:6px 8px;display:grid;gap:2px;font-size:.78rem;min-width:0}
.ph .meta .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .meta .where{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .num{position:absolute;top:6px;left:6px;font-family:var(--f-mono);font-size:.72rem;background:rgba(10,16,22,.72);color:#fff;padding:1px 6px;border-radius:4px}
.ph .chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(10,16,22,.35);display:grid;place-items:center;color:#fff}
.ph.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.ph.sel .chk{background:var(--sel);border-color:var(--sel)}
.ph .open{position:absolute;bottom:52px;right:6px;width:28px;height:28px;border-radius:6px;border:0;background:rgba(10,16,22,.65);color:#fff;display:grid;place-items:center;cursor:pointer}
.ph .open svg{width:15px;height:15px}
.ph.excluded .pimg{opacity:.35}
.ph .stat{position:absolute;top:32px;left:6px;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:3px;background:var(--fair);color:#fff}
img.missing{opacity:.2}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--paper);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.selbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selbar select{max-width:260px;background:var(--paper);color:var(--ink);border:0}
.selbar .btn{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 35%,transparent)}
.selbar .btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* Findings */
/* Findings: section list pinned on the left (a strip under the header on phones) */
.findings-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.findings-main{min-width:0}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--header-h,104px) + 12px);z-index:5;display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - var(--header-h,104px) - 24px);overflow:auto}
.secnav-link{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;border-left:3px solid transparent}
.secnav-link .no{font-family:var(--f-mono);color:var(--muted);font-size:.8rem;min-width:14px}
.secnav-link .name{flex:1;min-width:0}
.secnav-link:hover{background:var(--sunk)}
.secnav-link.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:700}
.sheet{scroll-margin-top:calc(var(--header-h,104px) + 16px)}
@media (max-width:860px){
  .findings-layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .secnav{top:calc(env(safe-area-inset-top,0px) + var(--header-h,104px));flex-direction:row;overflow-x:auto;max-height:none;padding:4px;border-radius:8px;scrollbar-width:none;box-shadow:0 6px 12px -10px rgba(0,0,0,.4)}
  .secnav::-webkit-scrollbar{display:none}
  .secnav-link{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:4px}
  .secnav-link.on{border-bottom-color:var(--accent)}
  .sheet{scroll-margin-top:calc(var(--header-h,104px) + 64px)}
}

/* The Action Recommendation box on a finding (yellow, like the old To-Do) */
.action-box{display:grid;gap:10px;padding:12px;border-radius:8px;background:var(--todo);border:1px solid var(--todo-line)}
.action-box-h{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--todo-ink)}
.action-box input,.action-box textarea,.action-box .seg button{background:var(--surface)}
.action-meta{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:12px;align-items:end}
.f .seg{justify-self:start;width:fit-content;max-width:100%}
.seg.priority button{padding:8px 14px}
@media (max-width:640px){.action-meta{grid-template-columns:1fr}}

/* Back button: labelled and outlined so it's easy to find */
.btn.back{border-color:var(--accent);color:var(--accent);font-weight:600;padding:6px 12px 6px 8px}
.btn.back:hover{background:var(--accent-soft)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.sheet>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.sheet>summary::-webkit-details-marker{display:none}
.sheet>summary .no{font-family:var(--f-mono);color:var(--muted)}
.sheet[open]>summary{border-bottom:1px solid var(--line)}
.sheet .body{padding:4px 16px 16px}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.item:last-child{border-bottom:0}
.item-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item-h .no{font-family:var(--f-mono);color:var(--muted);font-size:.84rem;min-width:30px}
.item-h .lbl{font-weight:600;font-size:1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button.on.G{background:var(--good);color:#fff}
.seg button.on.F{background:var(--fair);color:#fff}
.seg button.on.P{background:var(--poor);color:#fff}
.seg button.on.NA,.seg button.on.x{background:var(--ink);color:var(--paper)}
.seg button.on.H{background:var(--poor);color:#fff}
.seg button.on.M{background:var(--fair);color:#fff}
.seg button.on.L{background:var(--accent);color:var(--accent-ink)}
.sentence{font-style:italic;color:var(--muted);font-size:.9rem}
.strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.strip .thumb{width:76px;height:57px;border-radius:4px;cursor:pointer;border:1px solid var(--line)}
.issue{border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:7px;padding:12px;display:grid;gap:10px;background:var(--paper)}
.issue.pH{border-left-color:var(--poor)}.issue.pM{border-left-color:var(--fair)}.issue.pL{border-left-color:var(--accent)}
.issue-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.issue-h .no{font-family:var(--f-mono);font-weight:500}
.check{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:.88rem}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.hiddenitem{opacity:.6}

/* Review */
.checklist{display:grid;gap:8px}

            categoryPath: `${section.title} / ${item.label}`,
            title: finding.action.title,
            description: finding.description,
